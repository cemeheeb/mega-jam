[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=(A=1823396784,B=1298598689,C=1743498150,D=-2048051713)
ProjectName=Third Person BP Game Template

; Комнаты загружаются по имени (BP_Room_<Тип>), поэтому папку игры нужно упаковывать целиком.
[/Script/UnrealEd.ProjectPackagingSettings]
; Уровни перечислены явно: меню открывает игровой уровень по имени, и без этой строки он в сборку не попадал
; (найдено пробной упаковкой под Mac 15.11: «Новая игра» вела в никуда). Папка в DirectoriesToAlwaysCook уровни не берёт.
+MapsToCook=(FilePath="/Game/Game/Maps/Lvl_Menu")
+MapsToCook=(FilePath="/Game/Game/Maps/Lvl_Game")
+DirectoriesToAlwaysCook=(Path="/Game/Game")
; Героя ставит игроку ARunDirector из кода, поэтому его папка упаковывается целиком.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Engineer")
; Модели предметов (фонарь, блокнот) ARunItem грузит по пути, поэтому наборы окружения упаковываются целиком.
+DirectoriesToAlwaysCook=(Path="/Game/Environment")
; Лист блокнота экранный интерфейс (ARunHUD) грузит по пути.
+DirectoriesToAlwaysCook=(Path="/Game/UI")
; Крысу и анимации манекена (удары, смерть, реакция на попадание, рывок) ARunEnemy и ARunDirector грузят по пути.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/MutantRat")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins/Anims")
; Злого двойника (противник-человек) ARunEnemy грузит по пути.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/OldEnemy")
; Мертвецов ARunRoom::ApplyCorpses грузит по пути.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/DeadMan")
; Звук и музыку RunAudio грузит по имени (/Game/Audio/S_<Имя>).
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
; Модели предметов кармана ARunItem грузит по правилу имён (/Game/Items/<Имя>/SM_<Имя>), робота — ARunEnemy.
+DirectoriesToAlwaysCook=(Path="/Game/Items")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/MaintenanceRobot")
; Материалы аномалий (дым, линзы, грибы) ARunThreat и ARunRoom грузят по пути.
+DirectoriesToAlwaysCook=(Path="/Game/FX")
; Анимации приседа ARunDirector грузит по пути.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins/Anims/Crouch")
; Шрифты экрана — файлы .ttf, ARunHUD читает их напрямую из Content/Fonts.
+DirectoriesToAlwaysStageAsUFS=(Path="Fonts")
