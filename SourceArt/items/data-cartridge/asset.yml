title: Data Cartridge
kind: model
idea: Chunky plastic storage cartridge with a label and gold contacts.
prompt: "A chunky data storage cartridge about the size of a paperback book: a thick off-white matte plastic shell with rounded corners, a ribbed graphite rubber grip at one end, a blank muted teal label panel on the face, a row of brushed aluminium contacts along the front edge, and a small international orange write-protect slider on the side."
