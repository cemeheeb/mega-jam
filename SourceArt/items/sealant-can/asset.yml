title: Sealant Can
kind: model
idea: Dented aerosol can of hull-breach sealant with hazard stripes.
prompt: "A dented aerosol can of hull-breach sealant: a tall off-white painted metal cylinder with a shallow dent in one side, a band of diagonal international orange and graphite hazard stripes around the middle, a domed brushed aluminium top, a graphite plastic spray nozzle with a short straight tube, and a blank graphite label panel below the stripes."
avoid: spray cloud, foam
