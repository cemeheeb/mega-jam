title: Airlock Door Leaf
kind: model
style: interior
idea: "Sliding door leaf of the airlock. Orange slab without a window."
prompt: "A single flat sliding airlock door leaf: a tall rectangular slab one and a half metres wide, two and a quarter metres tall and only ten centimetres thick, of international orange painted metal. Its face is pressed into three shallow recessed panels stacked vertically, with a thick horizontal graphite rubber seal band at waist height, a narrow vertical muted teal indicator strip near one edge, rows of small flush rivets along the border and light scuffs near the bottom. Both faces look the same."
avoid: door frame, wall, window, porthole, handle wheel, hinges, open doorway, two leaves
notes: |
  Приоритет 1. Створки шлюзов: оранжевые коробки <сторона>_DoorInner и _DoorOuter (build_rooms.py airlock),
  150 × 10 × 225 см, восемь на комнату. Створка уезжает вбок в стену (ARunRoom двигает внутреннюю).
  Окна нет намеренно: соседняя комната не должна быть видна (DESIGN.md §6).
  Привязка — как у коробки, центр объёма; обе стороны одинаковые.
