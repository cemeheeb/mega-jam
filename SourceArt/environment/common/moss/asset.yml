title: Moss Decals
kind: texture
priority: 3
style: raw
idea: Moss masks for the decals of the fungal room.
prompt: "A straight-on, flat photograph of a patch of moss and mould creeping over a clean white painted wall, filling a wide 2:1 frame edge to edge. The growth spreads up from the bottom edge of the frame: a dense matte black mass all along the bottom across the full width, breaking upward into soft lumpy cushion shapes with fuzzy feathered edges, uneven height, taller in some places and lower in others, a few thin creeping tendrils and veins reaching higher, and a fine speckle of tiny dots fading into the white. The top third of the frame is clean pure white. Even shadowless lighting, no perspective, no wall texture, no panel seams, no objects, only black growth on pure white."
avoid: colour, green, brown, mushrooms, leaves, flowers, wall panels, seams, objects, perspective, shadows, text, frame border, vignette
later: true
notes: |
  Приоритет 3. Маски мха для заросшей грибами комнаты (ARunRoom::ApplyFungus). Сейчас мох рисуется масками копоти
  (environment/common/soot), покрашенными в болотный цвет, — по форме это дым, а не мох.
  Подача как у масок копоти: чёрное на белом, цвет даёт декаль. Отличие: рост идёт снизу вверх (у копоти — сверху).
  Нужно 3–4 картинки для стен (2:1) и 2–3 пятна для пола и мебели (квадрат, рост от середины к краям —
  в промте заменить «from the bottom edge» на «from the centre», «top third» на «outer edge»).
  Обработка — как source/make_soot_from_images.py у копоти; импорт — tools/ue/import_soot.py по образцу.
