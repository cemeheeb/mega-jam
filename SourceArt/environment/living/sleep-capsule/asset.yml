title: Sleep Capsule
kind: model
priority: 2
style: interior
idea: "Crew sleeping pod: bunk, end walls, canopy and a privacy visor."
prompt: "A crew sleeping pod of a spaceship, two metres thirty-six long, one metre wide and two metres twenty tall: a solid off-white painted metal bunk base at knee height with a long low step in front, a muted teal mattress with a white pillow and a folded light blanket, full-height solid end walls at the head and at the foot, a flat roof canopy joining them, and a narrow dark graphite privacy visor panel hanging from the front edge of the canopy. A small reading lamp and a muted teal control strip on the inside of the head wall, an international orange stripe along the base."
avoid: sleeping person, curtains, clutter, photographs
image: sleep-capsule-1.webp
notes: |
  Приоритет 2. Жилая комната: Sleep_Base 100 × 220 × 45, Mattress, Pillow, Blanket, стенки HeadWall и FootWall 100 × 8 × 170,
  крыша Canopy на 2,19 м, козырёк Visor 8 × 220 × 40, ступень Step 30 × 120 × 20 см.
  Открытая длинная сторона смотрит в комнату. Привязка — центр дна, открытая сторона в +Y.
  15.11: меш Tripo автора — source/tripo/sleep-capsule.fbx (из Загрузок, sleep-capsule.zip), картинка —
  images/sleep-capsule-1.webp. Модель собрана из примитивов скриптом tools/blender/kit/capsule_build.py,
  blend — source/sleep-capsule.blend, объект SleepCapsule, материал SleepCapsule (пока цвета зон для осмотра),
  меш Tripo — скрытый ReferenceTripo в коллекции Source (увеличен в 2,36 раза для сравнения).
  Масштаб: Tripo × 2360 = мм, корпус 2360 × 1000, как серые коробки. Меш Tripo трапецией (торцы 976 мм внизу и 730
  наверху, наружные грани завалены внутрь); по слову автора — параллелепипед без сужения, все стенки вертикальные
  на всю глубину 1000. Высота по выбору автора 1800 (у Tripo 1552, над матрасом 0,8 м — не сесть): всё ниже верха
  матраса по Tripo, высота над ним растянута (потолок 1690, над матрасом 1080), детали стенок сдвинуты с ней.
  Оси Blender: X вдоль капсулы, изголовье в −X (подушка слева, как на картинке), открытая сторона в −Y, начало — центр
  корпуса на полу; ступень выступает вперёд до y −700. В Unreal (x, −y, z) × 100: открытая сторона в +Y. Чтобы она
  смотрела в комнату на север (+X), нужен yaw −90, и тогда изголовье окажется на востоке, а не у западной стены, как
  у серых коробок: при выгрузке решить, двигать капсулу или нет.
  Устройство: торцы по 180 мм, наружные углы R 40, у проёма R 26, сверху алюминиевая крышка со скруглением 24,
  внизу алюминиевый цоколь. Изголовье внутри: пульт с бирюзовой рамкой, экраном, тремя огоньками и круглой кнопкой,
  лампа для чтения (пластина, штанга, стакан с линзой), винты панелей; снаружи лючок (швы — в карте высот), 6 винтов,
  ручка-выемка. Изножье внутри: ниша с выпуклой рамкой и графитовым вкладышем, над ней графитовая дверца шкафчика
  (как у Tripo; на картинке эта сторона не видна); снаружи утопленная ручка с поручнем, защёлка, вертикальная
  оранжевая полоса у переднего угла. Основание глубиной 900 (на 50 за лицом торцов, как у Tripo): лючок с двумя
  прорезями и 4 винтами, щель слева, оранжевая полоса 240–300 мм с разрывом у лючка, идёт и по лицам торцов,
  у изножья заходит за угол (по текстуре Tripo). Алюминиевая рамка проёма — брус 50 × 50 со скруглёнными рёбрами,
  внизу изгибы R 70 по внутренней стороне; сзади такая же, её стойка у изголовья — рядом с задней панелью.
  Задняя панель у изголовья (на картинке: решётка и лючок с винтами); остальная спина открыта, как на картинке.
  Крыша: алюминиевые балки спереди и сзади, белая панель с двумя тёмными решётками; под передней балкой графитовый
  козырёк со скруглёнными углами, язычком и двумя петлями. Матрас из трёх подушек (fabric), подушка — две пухлые
  половины со швом (linen), одеяло сложено втрое в ногах и свисает за край матраса. Ступень: алюминиевый корпус,
  резиновая графитовая накладка, две торцевые крышки со скруглением спереди и винтами.
  Отступления: у Tripo второй козырёк и вторая ступень сзади — убраны, спина стоит у стены.
  Швы панелей, отверстия решёток и рифление накладки ступени — в карте высот, не в сетке.
  Сетка: 5258 граней, 11 042 треугольника, 102 острова с развёрткой в метрах; рёбер с тремя гранями и вырожденных
  граней нет. Зоны: white, aluminium, plastic (тёмный графитовый пластик), graphite (резина накладки), teal (экран,
  рамка пульта, линза лампы), orange, fabric, linen — восемь классов карты id. Упаковка развёртки и текстуры —
  после осмотра автором (kit.md, остановка после шага 2).
  15.11, в игру до текстур (автор: «его тоже можешь добавить в UE заменить кровать»): source/export_sleep_capsule.py
  пишет SM_SleepCapsule.fbx (236,5 × 120 × 180 см, слот на зону MI_Capsule<Зона>, пять коробок коллизии: лежанка до
  верха матраса 61 см, торцы, крыша, ступень) и zones.json с цветами зон; blend не меняется. Импорт —
  tools/ue/import_sleep_capsule.py в /Game/Environment/Living/SleepCapsule, зоны — однотонные M_KitSolid. Швов панелей,
  решёток и рифления ступени в игре пока нет: они в карте высот следующих шагов. В build_rooms.py living капсула
  стоит с yaw −90 (изголовье на востоке), место предмета — на матрасе посередине.
