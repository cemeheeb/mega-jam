notes: |
  Набор из Singula (environment/bridge/command-console-parts): модели и текстуры сделаны для Singula, glb от 10 ноября 2026
  (до джема — задекларировать, DESIGN.md §11). Взяты по просьбе автора 14.11 («переноси все ассеты из Singula,
  которые помогут»). source/singula/ — glb и текстуры как есть, в Singula ничего не меняется.
  tools/blender/export_singula.py пишет SM_*.fbx в сантиметрах (дети слиты с корнем, коллизия — коробка UCX,
  слот MI_CommandConsoleParts) и T_CommandConsoleParts_*.png. Нормали — для OpenGL, в Unreal flip green.
  В Unreal: /Game/Environment/Bridge/CommandConsoleParts, импорт tools/ue/import_singula.py.
  Где стоит: панель пилота и консоли кольца рубки (build_rooms.py bridge).
  Вид — полуреалистичный PBR Singula, не живописный, как решено 14.11.
