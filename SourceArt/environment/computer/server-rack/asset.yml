idea: "Double-width server rack with indicator strips."
prompt: "A double-width server rack cabinet two metres wide, two metres forty tall and seventy centimetres deep: an off-white painted metal frame with rounded corners and a slightly overhanging top cover, a front of four rows of graphite perforated server drawers with small handles, a thin horizontal muted teal indicator light strip under each row, an international orange stripe along the base and a block of ventilation slots on each side."
avoid: open doors, monitors, keyboard
notes: |
  Приоритет 2. Вычислительный центр: Rack1–4 70 × 200 × 240 см, полосы Rack_Strip на высоте 0,5, 1,0, 1,5 и 2,0 м,
  крышка Rack_Top. Четыре штуки, лицом друг к другу. Полосы светятся в Unreal.
  Для выгоревшей комнаты позже понадобится сгоревшая версия, как у колонок стен. Привязка — центр дна, лицо меша в +Y, как у наборов Singula.
  15.11: меш Tripo автора — source/tripo/server-rack.fbx (из Загрузок, server-rack.zip, с текстурой в server-rack.fbm).
  Модель собрана из примитивов скриптом tools/blender/kit/server_rack_build.py, сцену собирает и сохраняет
  tools/blender/kit/server_rack_scene.py (фоном). Blend — source/server-rack.blend, объект ServerRack, материал ServerRack
  (пока цвета зон для осмотра), меш Tripo — скрытый ReferenceTripo в коллекции Source (× 2 для сравнения).
  Масштаб: Tripo × 2000 = мм, ширина 1990 по крышке, как у серой коробки. Высота при этом 2000, а не 2400, как в
  карточке, и глубина 807 по ящикам (корпус 740, крышка 790), а не 700: меш Tripo спереди квадратный. Растягивать по
  высоте или нет — решает автор; серые коробки в build_rooms.py computer (70 × 200 × 240) поправить под итог.
  Оси Blender: X поперёк лица, лицо в −Y, начало — середина дна. В Unreal (x, −y, z) × 100 лицо в +Y.
  Устройство: корпус 1940 × 740 с вертикальными скруглениями R 70; лицевая рама с восемью нишами 848 шириной и 16 глубиной
  (белая подкладка), между рядами рельсы 44 мм с бирюзовой полосой 635 × 24 (утоплена на 2 мм) и пятью окошками
  огоньков статуса у правого конца (glass, у каждого свои острова: цвет и состояние задаст текстура); оранжевая полоса
  117–173 мм по лицу и бокам, на спине только у углов, как у Tripo; снизу на боках выемка 36 мм между передней и задней
  опорами со скруглениями R 24; крышка 1990 × 790 × 113, R 85, снизу скругление 8, сверху 40.
  Ящик (8 штук, у каждого свои острова): графитовый корпус 790 × 336 выходит из ниши на 40 мм за раму, по переду
  скругление 6; утопленная решётка 600 × 268 × 10; по краям ниши ручек 48 × 230 × 40, в них U-образная ручка 16 × 10
  (за ней 28 мм под пальцы, хват 190 мм) с белой защёлкой.
  Швы боковых панелей, щели вентиляции на боках, шов посередине лица и отверстия решёток — в карте высот, не в сетке
  (как швы у капсулы). Дна под опорами нет: стоит на полу.
  Сетка: 3235 граней, 5682 треугольника, 164 острова с развёрткой в метрах; рёбер с тремя гранями и вырожденных граней
  нет. Зоны: white, orange, plastic (графитовый пластик ящиков и ручек), grille (решётки), teal (полосы), glass
  (огоньки). Упаковка развёртки и текстуры — после осмотра автором (kit.md, остановка после шага 2).
  15.11, в игру до текстур (автор: «сохраняй и экспортируй в UE»), высота осталась 2000: source/export_server_rack.py
  пишет SM_ServerRack.fbx (199 × 80,7 × 200 см, слот на зону MI_ServerRack<Зона>, три коробки коллизии: корпус до
  1887 мм, крышка, ящики с ручками) и zones.json с цветами зон; blend не меняется. Импорт —
  tools/ue/import_server_rack.py в /Game/Environment/Computer/ServerRack, зоны — однотонные M_KitSolid, бирюзовые
  полосы и огоньки светятся (EmissiveStrength 2 и 2); полосам в Unreal дан цвет глубже цвета осмотра (0,02; 0,30; 0,34):
  светлая бирюза при свете комнаты выходила почти белой. Швов, щелей вентиляции и отверстий решёток в игре пока нет: они
  в карте высот следующих шагов. В build_rooms.py computer четыре стойки стоят на местах серых коробок (x 190 и 340,
  y ±250) лицом на юг, к середине комнаты (yaw 90), как светились полосы коробок; коробки Rack*_Strip* и Rack*_Top
  убраны. Сгоревшей версии пока нет: в выгоревшей комнате стойка покрывается копотью.
