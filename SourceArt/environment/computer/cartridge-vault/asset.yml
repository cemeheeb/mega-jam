notes: |
  Приоритет 2. Вычислительный центр: Vault 160 × 40 × 180 см, двенадцать гнёзд Vault_Slot 30 × 40 см в три ряда.
  Картриджи — как предмет items/data-cartridge. Привязка — центр дна, лицо меша в +Y, как у наборов Singula.
  Blender: tools/blender/kit/vault_build.py, примитивы по мешу Tripo (×1,801), ReferenceTripo скрыт в Source.
  По мешу 159 × 65 × 180 см, а не 40 в глубину: серую коробку Vault в build_rooms.py надо сделать глубиной 65.
  Пустые гнёзда: средний ряд справа и нижний третий. Швы панелей, решётки и вентиляция пойдут в карту высот.
