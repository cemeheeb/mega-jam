title: Diagnostic Capsule
kind: model
priority: 2
style: interior
idea: "Lying scanner tube on a base with a control pedestal."
prompt: "A medical diagnostic scanner capsule: a horizontal tube two metres twenty long and about a metre across of milky frosted muted teal glass lying on a long low off-white painted metal base with an international orange stripe, with two thick square-section graphite scanner rings around the tube, one near each end, and a rounded end cap with a hatch handle. Next to the base, as part of the same unit, a waist-high slanted control pedestal with a muted teal screen."
avoid: patient inside, open lid, cables on the floor
notes: |
