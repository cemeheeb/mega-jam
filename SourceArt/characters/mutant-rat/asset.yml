title: Mutant Rat
kind: model
style: creature
idea: Giant rat mutated by radiation, escaped from the ship's laboratory. An enemy that lives in its room (DESIGN.md §5.9).
prompt: "A giant mutated rat the size of a large dog, a laboratory rat that escaped and grew huge from radiation: a heavy, hunched, muscular body with a thick neck and powerful shoulders, a long narrow snout with a wrinkled snarling nose and long stiff whiskers, small torn ears with ragged edges, and small deep-set furious blood-red eyes. Its fur is long, coarse and shaggy, dark grey-brown, matted into spiky tufts that bristle along the spine and the back of the neck, with a few bare patches of pinkish scarred skin and small lumpy radiation growths on the flanks. The lips are pulled back from long curved yellow incisors, the jaws closed. Bare pinkish-grey paws with long dark curved claws, and a long thick hairless scaly tail."
avoid: pet rat, mouse, glowing eyes, extra limbs, several heads, exposed bones, blood, gore, drool, wet fur, collar, clothing, armour, mechanical implants
notes: |
  Запрос автора 15.11: «гигантская мутировавшая от радиации крыса, злая волосатая с красными глазами».
  По DESIGN.md §5.9 п. 5: крысы сбежали из лаборатории и выросли в огромных тварей. В сером прототипе их четыре
  (RunEnemyTune: скорость 420, урон 10, умирают с одного удара).
  Стиль промта — creature (SourceArt/studio.yml): живописный мазок, как у персонажей; стоит на четырёх лапах,
  хвост вытянут назад, пасть закрыта, резцы оскалены — так проще Tripo и риг (рот не анимируется).
  Размер [допущение]: с крупную собаку — около 1,1 м от носа до основания хвоста, 0,5 м в холке, хвост 0,8–0,9 м.
  Шерсть — плотными клочьями, а не отдельными волосками: отдельные пряди Tripo превращает в мусор.
  Красные глаза без свечения на картинке; свечение, если нужно, добавится в Unreal (эмиссия по маске глаз).
  Скелет манекена Unreal не подходит: риг четвероногого — в Tripo или в Blender.
  15.11: меш Tripo — source/tripo/mutant_rat.fbx (из текстур только цвет), blend — source/mutant-rat.blend.
  Меш увеличен ×2: тело 1,1 м от носа до хвоста, всего 2,0 м, высота 0,82 м по горбу; морда в −Y, лапы на z = 0.
  Риг — tools/blender/creatures/mutant_rat_rig.py: объект арматуры root (как у героя), 30 деформирующих костей
  pelvis, spine_01–03, neck, head, tail_01–08, scapula/upperarm/lowerarm/hand и thigh/calf/foot/ball _l/_r,
  плюс управляющие ik_hand_*, ik_hand_tip_*, ik_foot_*, ik_foot_ball_* (не деформируют, в игру не идут).
  Лапы на IK: колени и локти — шарниры, лапы стоят на полу, пока тело движется (промах IK 0; исключение —
  смерть: верхняя вытянутая задняя лапа прямая и не достаёт до цели 3 см).
  Bone heat на этом меше не сработал (130 отдельных кусков, открытая шерсть), веса считает скрипт:
  расстояние до кости / её толщина, кости одной стороны не тянут другую, сглаживание по рёбрам. Вершины, ближайшие
  к кисти или стопе, берут веса только от костей своей лапы (до двух звеньев): иначе толстые кости тела дотягивались
  до когтей и когти вытягивались шипами (скриншот автора 15.11).
  Нормали — tools/blender/creatures/mutant_rat_normals.py (после рига): у Tripo нормали перепутаны, лоскуты шерсти
  выходили чёрными (скриншот автора 15.11). Грани развёрнуты наружу, шерсти на теле задано поле нормалей «от костей»;
  морда, лапы, уши, глаза и наросты оставлены с нормалями Tripo (свои нормали показали ступеньки на морде),
  разрезы кожи под лоскутами заделаны, у тонких листов (лоскуты, уши, усы) есть изнаночные двойники —
  поэтому материал односторонний: в Unreal Two Sided выключить. Треугольников стало 56 тыс. (было 31 тыс.).
  Полупрозрачные кончики шерсти не делали: под лоскутами у Tripo нет кожи, прозрачность открывает дыры.
  Анимации — tools/blender/creatures/mutant_rat_anim.py, 30 кадров/с, на месте (двигает актор игры):
  A_MutantRat_Idle — дыхание, оглядывается, принюхивается, цикл 90 кадров (3 с);
  A_MutantRat_Walk — рысь, цикл 18 кадров (0,6 с), шаг 0,36 м = 1,0 м/с; в игре скорость проигрывания
  = скорость / 1,0 м/с (сейчас RatSpeed 4,2 м/с — это ×4,2, для такой крысы стоит снизить скорость или сделать бег);
  A_MutantRat_Aggro — угроза на месте, цикл 48 кадров (1,6 с); A_MutantRat_Attack — 24 кадра, укус на 12-м
  (момент урона), бросок на 0,22 м вперёд и назад; A_MutantRat_Hit — 18 кадров, отброс назад и влево;
  A_MutantRat_Leap — атака с дистанции, прыжок на живот, 42 кадра (1,4 с): присед 0–9, толчок 12, полёт 12–30
  (дуга в самой анимации: таз до +0,25 м, морда на высоте ~1,0 м), укус на 20-м кадре (момент урона),
  приземление 30. Вперёд по полу актор двигает игра на кадрах 12–30 (0,4–1,0 с);
  A_MutantRat_Death — смерть, 60 кадров (2 с), не по кругу, держать последний кадр: удар, лапы подгибаются,
  заваливается на левый бок (касание на 24-м; повёрнута на 112°, а не на 90°: бок у неё скошен, и на 90° тело
  стояло на ребре живота, таз висел в 0,2 м над полом), лапы, хвост и голова расслабленно падают на пол
  (хвост — упругой дугой, без излома), задние лапы вытянуты назад, стопы продолжают линию ноги носками назад,
  нижняя передняя лапа вытянута вперёд, а не подмята под грудь; судорога верхней
  задней лапы (рывки по 3 кадра, 35–50, кончики пальцев до 10 см), по хребту медленнее проходит дрожь (34–58,
  период 0,4 с, морда смещается до 3 см), вздрагивание передней лапы (54), неподвижна с 58-го;
  тело в итоге на 0,2 м левее.
  Выгрузка FBX ещё не делалась.
  15.11, ночь: выгружена и стоит в игре. source/export_mutant_rat.py пишет SK_MutantRat.fbx (меш, 30 деформирующих костей, семь действий запечены покадрово, файл в метрах) и T_MutantRat_BaseColor/ORM; tools/ue/import_mutant_rat.py (без окна) импортирует в /Game/Characters/MutantRat с переводом единиц: меш 48 × 200 × 82 см, анимации A_MutantRat_<Имя>, материал MI_MutantRat (M_Kit). В игре — ARunEnemy: две крысы, по два удара на каждую, рысь 2,4 м/с (анимация ×2), прыжок с 2,6–5,2 м (присела на 0,4 с — прыгает, укус на 0,67 с), укус вблизи (анимация Attack, укус на 0,4 с), Hit при попадании ключом, Death при смерти. Числа — RunEnemyTune в RunEnemy.h.
