title: Old Enemy
kind: model
style: character
idea: The old man assembled from two generated models, old-enemy-body and old-enemy-head, on the Unreal mannequin skeleton so the template animations play on him.
prompt: ""
notes: |
  Запрос автора 15.11: собрать модель из man_old_enemy.zip и man_old_enemy_head.zip «как мы делали» раньше,
  сохранить blend и выгрузить в Unreal так, чтобы меш вставал на манекен. Сделано по образцу героя (characters/engineer)
  и мертвеца (characters/dead-man).

  Сборка (source/old-enemy.blend): тело Tripo ×1,55 (верх воротника 1,55 м, как у героя), голова ×0,38, рост 1,75 м,
  лицо в −Y Blender. Обе модели сдвинуты на 3 см вперёд, под туловище манекена: спина у старика сутулая.
  Обрубок шеи тела внутри воротника удалён; низ шеи головы продлён на 6 см внутрь тела. Расширение шеи головы
  сзади торчало сквозь ткань на плечах — там вершины поджаты под ткань (до 2,5 см). Кончики волос сзади касаются
  воротника, как у мертвеца. Объекты OldEnemy_Body и OldEnemy_Head, материалы OldEnemy_Body и OldEnemy_Head,
  текстуры — из source/tripo соседних карточек (пути относительные). Цвет кожи рук с головой не выравнивался.

  Риг: скелет манекена Unreal (объект root под пустышкой Rig 0,01; меш Manny_ref скрыт — SKM_Manny_Simple из проекта).
  Кости рук и кистей повёрнуты под тело (А-поза Tripo: руки круче, чем у манекена) и применены как поза покоя,
  длины и смещения костей не тронуты — меш встаёт на SK_Mannequin. Ноги и позвоночник манекена оставлены как есть:
  ноги и так проходят по штанинам, а позвоночник не выпрямлен, чтобы сутулость сохранилась в анимациях.
  Веса тела перенесены с манекена по ближайшей поверхности, не больше 4 костей на вершину; пальцы не гнутся (вся кисть
  на hand_l/hand_r); воротник не цепляется за голову (веса head и neck_02 переданы neck_01).
  Веса головы — по наклонной плоскости под челюстью (от низа бороды спереди к основанию черепа сзади): выше — head,
  ниже плавно neck_02, neck_01, внутри воротника spine_05. Волосы, свисающие ниже этой плоскости, частично идут за шеей.
  Проверено тестовой позой в Blender (голова 35°, рука поднята, колено 70°): шея, плечо и колено без разрывов.

  Выгрузка: source/export_old_enemy.py -> SK_OldEnemy.fbx (в сантиметрах, 88 костей + root), T_OldEnemy_{Body,Head}_BaseColor
  (jpg Tripo в PNG), однотонные T_OldEnemy_{Body,Head}_ORM (шероховатость 0,85). Тело 21,4 тыс. треугольников, голова 16,1 тыс.
  В Unreal (15.11): /Game/Characters/OldEnemy/SK_OldEnemy на скелете /Game/Characters/Mannequins/Meshes/SK_Mannequin,
  материалы MI_OldEnemy_Body и MI_OldEnemy_Head (M_Kit), импорт tools/ue/import_old_enemy.py (--mesh — заново после выгрузки).
  Рост 175,3 см. Скелет шаблона не изменился. На уровне Lvl_CharacterTest проверены неподвижные кадры MM_Idle
  и MF_Unarmed_Jog_Fwd рядом с Manny: позы совпадают; проверочные акторы после снимка удалены.
  В игру (противник «человек», угроза 7 в selftest.sh) меш ещё не поставлен.
  15.11, ночь: в игре стоит на противнике-человеке (ARunEnemy берёт /Game/Characters/OldEnemy/SK_OldEnemy; нет его — меш героя). Бег MF_Unarmed_Jog_Fwd, удар MM_Attack_02, смерть MM_Death_Front_01, покой MM_Idle — анимации манекена шаблона по одной, без блюпринта анимации. Проверено кадром (бежит на игрока) и самопроверкой (бьёт, получает, умирает).
