title: Dead Man
kind: model
style: character
idea: A dead crew member assembled from two generated models, dead-man-body and dead-man-head, rigged and posed as corpses to lay about the level, some of them half inside walls after a teleport.
prompt: ""
notes: |
  Запрос автора 15.11: собрать голову и тело, сделать удобный риг и несколько поз, чтобы раскладывать тела по уровню:
  на полу, завалившись у стены, калачиком, по несколько вариантов; пару неестественных (вывернутые руки, голова);
  пару поз, где тело торчит из стены, «как будто его телепортировало мимо пустого пространства и замуровало».
  Позы на полу и у стены абстрактные, чтобы их можно было ставить процедурно.

  Сборка в Blender (source/dead-man.blend, объект DeadMan): тело Tripo ×1,5, голова ×0,38, рост около 1,65 м,
  стопы на z = 0, лицо в −Y. Из тела удалён обрубок шеи (366 граней), шея головы продлена внутрь ворота на 6 см.
  Кончики волос сзади заходят в ворот — автор оставил так. 21,7 тыс. вершин, 23,7 тыс. граней, два материала
  DeadMan_Body и DeadMan_Head, текстуры берутся из source/tripo соседних карточек (пути относительные).
  Цвет кожи рук выровнен по голове (запрос автора) — tools/blender/characters/dead_man_skin.py: у Tripo предплечья
  и кисти были темнее и коричневее лица. Скрипт перекрашивает в Lab только кожу рук от манжеты (маска по геометрии,
  мягкий переход у манжеты, насыщенный оранжевый не трогает) под среднее и разброс кожи головы. Результат —
  T_DeadMan_Body_BaseColor.png рядом с карточкой, на него переключён материал DeadMan_Body; jpg Tripo не изменён.

  Риг — Rigify, базовый человек (объект rig; metarig скрыт, нужен только для перегенерации), веса автоматические.
  Деформируют кости DEF-*; в игру пойдут только они. Пальцев нет (в базовом метариге их нет), кисти не сгибаются.

  Позы — tools/blender/characters/dead_man_poses.py, однокадровые действия P_DeadMan_*, отмечены как ассеты (Pose Library).
  Ставятся на свою опору автоматически: туловище ложится на пол, руки и ноги опускаются до пола.
  Опоры для расстановки в игре:
  - Floor, Curl, Broken — лежат на полу; начало координат под тазом, поворот вокруг вертикали любой;
  - Wall — завалившись у стены; стена — плоскость y = 0 за спиной (тело в −Y), начало на полу у стены под тазом;
  - Embed — в стене; лицевая сторона стены y = 0, стена в +Y. Стены 30 см (RunRoom.h, Wall), поэтому при выгрузке
    всё, что глубже 0,28 м в стене, надо отрезать, иначе вылезет в соседнюю комнату (ещё не сделано).
  Позы:
  Floor1 на спине, раскинулся; Floor2 лицом вниз, нога согнута в сторону; Floor3 на левом боку, верхняя нога вперёд;
  Wall1 сидит у стены, подбородок на груди; Wall2 сидит, колено поднято, голова на плече; Wall3 сполз набок по стене;
  Curl1 калачиком на левом боку; Curl2 на правом боку, руки у лица; Curl3 рухнул на колени;
  Broken1 на спине, голова свёрнута на 160° лицом в пол, рука согнута в обратную сторону, нога вбок;
  Broken2 лицом вниз, лицо повёрнуто вверх, рука заломлена за спину, локоть и колено вывернуты;
  Embed1 свисает из стены от пояса на высоте 1 м; Embed2 из стены у пола торчат только ноги;
  Embed3 стоит в стене, наружу только лицо и тянущаяся рука.

  Посмотреть позу в Blender: выделить rig; внизу Dope Sheet → режим Action Editor → в выпадающем списке действия
  выбрать P_DeadMan_*. Или: Asset Browser → Current File → Actions, двойной щелчок по позе применяет её.
  Не назначать действия объекту DeadMan — только rig.

  Не сделано: отрезка поз Embed по стене, выгрузка FBX (только по запросу автора).
