title: Key Art
kind: texture
idea: Cover picture. The engineer at an airlock door with a few objects in his open hand. Title screen and itch.io page.
prompt: "A cinematic wide shot inside a bright off-white spaceship airlock. In the centre, seen from behind and slightly to the side from the waist up, stands a thin bearded ship engineer in a clean international orange work coverall. He holds his open palm in front of him and looks down at three small objects lying on it: a glass fuse, a small brass valve and a folded paper note. Right in front of him a closed sliding door with an international orange frame and a muted teal indicator strip; through the narrow gap between its leaves spills warped light, and the straight lines of the wall panels bend slightly towards the door as if space itself is pulled into it. Calm, tense mood, soft cool light from above, warm glow from the gap. The figure and the door sit in the central part of the picture, with quiet empty wall above them, so the image works both in a wide 16:9 crop and in a 5:4 crop."
avoid: a visible black hole, stars, windows, other people, weapons, helmet, gloves, dirt, blood
